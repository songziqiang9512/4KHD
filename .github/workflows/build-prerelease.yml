name: Build Prerelease

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "**"

permissions:
  contents: write
  actions: read

concurrency:
  group: build-prerelease-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show Xcode environment
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Resolve version
        id: version
        run: |
          version="$(script/resolve_version.sh)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=build-$version" >> "$GITHUB_OUTPUT"
          script/update_version.sh

      - name: Import Developer ID certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/developer_id_certificate.p12"
          keychain_path="$RUNNER_TEMP/app-signing.keychain-db"

          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" \
            -P "$P12_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$keychain_path"
          security list-keychain -d user -s "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path"

      - name: Build app
        env:
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          source script/version.env
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$DEVELOPER_ID_APPLICATION" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            OTHER_CODE_SIGN_FLAGS="--timestamp --options runtime" \
            build

      - name: Sign and verify app
        id: sign
        env:
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
        run: |
          set -euo pipefail
          source script/version.env
          app_path="build/DerivedData/Build/Products/Release/$APP_NAME.app"
          if [[ ! -d "$app_path" ]]; then
            echo "App bundle not found: $app_path" >&2
            exit 1
          fi

          while IFS= read -r nested; do
            codesign --force --options runtime --timestamp --sign "$DEVELOPER_ID_APPLICATION" "$nested"
          done < <(
            find "$app_path/Contents" \
              \( -name '*.framework' -o -name '*.dylib' -o -name '*.xpc' -o -name '*.appex' -o -name '*.app' \) \
              -print 2>/dev/null
          )

          if [[ -d "$app_path/Contents/MacOS" ]]; then
            while IFS= read -r executable; do
              codesign --force --options runtime --timestamp --sign "$DEVELOPER_ID_APPLICATION" "$executable"
            done < <(find "$app_path/Contents/MacOS" -type f -perm -111 -print)
          fi

          codesign --force --options runtime --timestamp --sign "$DEVELOPER_ID_APPLICATION" "$app_path"
          codesign --verify --strict --deep --verbose=4 "$app_path"
          echo "app_path=$app_path" >> "$GITHUB_OUTPUT"

      - name: Package for notarization
        id: package
        run: |
          set -euo pipefail
          source script/version.env
          app_path="${{ steps.sign.outputs.app_path }}"
          zip_path="build/$APP_NAME-${{ steps.version.outputs.version }}-notarization.zip"
          mkdir -p build
          ditto -c -k --keepParent "$app_path" "$zip_path"
          echo "zip_path=$zip_path" >> "$GITHUB_OUTPUT"

      - name: Notarize app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          xcrun notarytool submit "${{ steps.package.outputs.zip_path }}" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

      - name: Staple and package final app
        id: final_package
        run: |
          set -euo pipefail
          source script/version.env
          app_path="${{ steps.sign.outputs.app_path }}"
          zip_path="build/$APP_NAME-${{ steps.version.outputs.version }}.zip"
          xcrun stapler staple "$app_path"
          xcrun stapler validate "$app_path"
          spctl --assess --type execute --verbose=4 "$app_path"
          ditto -c -k --keepParent "$app_path" "$zip_path"
          echo "zip_path=$zip_path" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 4KHD-${{ steps.version.outputs.version }}
          path: ${{ steps.final_package.outputs.zip_path }}
          if-no-files-found: error

      - name: Generate release notes
        id: notes
        run: |
          set -euo pipefail
          current_tag="${{ steps.version.outputs.tag }}"
          previous_tag="$(git tag --list 'build-*' --sort=-creatordate | grep -v "^${current_tag}$" | head -n 1 || true)"
          notes_file="build/release-notes.md"
          mkdir -p build
          {
            echo "Prerelease ${{ steps.version.outputs.version }}"
            echo
            if [[ -n "$previous_tag" ]]; then
              echo "Changes since $previous_tag:"
              git log --pretty=format:'- %s (%h)' "$previous_tag"..HEAD
            else
              echo "Changes:"
              git log --pretty=format:'- %s (%h)' HEAD
            fi
          } > "$notes_file"
          echo "notes_file=$notes_file" >> "$GITHUB_OUTPUT"

      - name: Create or update prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          version="${{ steps.version.outputs.version }}"
          zip_path="${{ steps.final_package.outputs.zip_path }}"
          notes_file="${{ steps.notes.outputs.notes_file }}"

          git tag -f "$tag" "$GITHUB_SHA"
          git push -f origin "refs/tags/$tag"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" \
              --title "$version" \
              --notes-file "$notes_file" \
              --prerelease
            gh release upload "$tag" "$zip_path" --clobber
          else
            gh release create "$tag" "$zip_path" \
              --title "$version" \
              --notes-file "$notes_file" \
              --prerelease \
              --target "$GITHUB_SHA"
          fi
