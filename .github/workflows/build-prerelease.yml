name: Build Prerelease

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "**"

permissions:
  contents: write
  actions: read

concurrency:
  group: build-prerelease-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure scripts are executable
        run: chmod +x script/*.sh

      - name: Show Xcode environment
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Resolve version
        id: version
        run: |
          source script/version.env
          version="$(script/resolve_version.sh --next)"
          short_sha="${GITHUB_SHA::7}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=build-$version" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$APP_NAME-$version-$short_sha.dmg" >> "$GITHUB_OUTPUT"
          script/update_version.sh --next

      - name: Validate signing secrets
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          missing=()
          for name in \
            BUILD_CERTIFICATE_BASE64 \
            P12_PASSWORD \
            KEYCHAIN_PASSWORD \
            DEVELOPER_ID_APPLICATION \
            APPLE_ID \
            APPLE_APP_SPECIFIC_PASSWORD \
            APPLE_TEAM_ID
          do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done

          if [[ "${#missing[@]}" -gt 0 ]]; then
            printf 'Missing required GitHub Secrets:\n' >&2
            printf '  - %s\n' "${missing[@]}" >&2
            exit 1
          fi

      - name: Import Developer ID certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/developer_id_certificate.p12"
          keychain_path="$RUNNER_TEMP/app-signing.keychain-db"

          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" \
            -P "$P12_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$keychain_path"
          security default-keychain -d user -s "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path"
          echo "SIGNING_KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"

      - name: Build app
        env:
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          source script/version.env
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$DEVELOPER_ID_APPLICATION" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            OTHER_CODE_SIGN_FLAGS="--keychain $SIGNING_KEYCHAIN_PATH --timestamp --options runtime" \
            build

      - name: Sign app bundle
        id: sign
        env:
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
        run: |
          set -euo pipefail
          source script/version.env
          app_path="build/DerivedData/Build/Products/Release/$APP_NAME.app"
          if [[ ! -d "$app_path" ]]; then
            echo "App bundle not found: $app_path" >&2
            exit 1
          fi

          script/sign_release_app.sh "$app_path" "$DEVELOPER_ID_APPLICATION" "$SIGNING_KEYCHAIN_PATH"
          echo "app_path=$app_path" >> "$GITHUB_OUTPUT"

      - name: Notarize app bundle
        id: notarize_app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          source script/version.env
          app_path="${{ steps.sign.outputs.app_path }}"
          zip_path="build/$APP_NAME-${{ steps.version.outputs.version }}-app-notarization.zip"
          mkdir -p build
          ditto -c -k --keepParent "$app_path" "$zip_path"
          script/notarize_with_log.sh "$zip_path" build/notary-app-submit.json build/notary-app-log.json

      - name: Staple notarized app bundle
        run: |
          set -euo pipefail
          app_path="${{ steps.sign.outputs.app_path }}"
          xcrun stapler staple "$app_path"
          xcrun stapler validate "$app_path"
          spctl --assess --type execute --verbose=4 "$app_path"

      - name: Create signed DMG
        id: final_package
        env:
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
        run: |
          set -euo pipefail
          source script/version.env
          app_path="${{ steps.sign.outputs.app_path }}"
          dmg_path="build/${{ steps.version.outputs.artifact_name }}"
          script/create_dmg.sh "$app_path" "$dmg_path" "$APP_NAME"
          codesign --force --timestamp --sign "$DEVELOPER_ID_APPLICATION" --keychain "$SIGNING_KEYCHAIN_PATH" "$dmg_path"
          codesign --verify --verbose=4 "$dmg_path"
          echo "dmg_path=$dmg_path" >> "$GITHUB_OUTPUT"

      - name: Notarize and staple DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          dmg_path="${{ steps.final_package.outputs.dmg_path }}"
          script/notarize_with_log.sh "$dmg_path" build/notary-dmg-submit.json build/notary-dmg-log.json
          xcrun stapler staple "$dmg_path"
          xcrun stapler validate "$dmg_path"
          spctl -a -vvv --type open --context context:primary-signature "$dmg_path"
          source script/version.env
          EXPECT_SIGNED_RELEASE=1 EXPECT_NOTARIZED_DMG=1 script/verify_packaged_dmg.sh "$dmg_path" "$APP_NAME"
          shasum -a 256 "$dmg_path" | awk '{print $1 "  " $2}' > "${dmg_path}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 4KHD-${{ steps.version.outputs.version }}
          path: |
            ${{ steps.final_package.outputs.dmg_path }}
            ${{ steps.final_package.outputs.dmg_path }}.sha256
            build/notary-app-submit.json
            build/notary-dmg-submit.json
          if-no-files-found: error

      - name: Generate release notes
        id: notes
        run: |
          set -euo pipefail
          current_tag="${{ steps.version.outputs.tag }}"
          previous_tag="$(git tag --list 'build-*' --sort=-creatordate | grep -v "^${current_tag}$" | head -n 1 || true)"
          notes_file="build/release-notes.md"
          mkdir -p build
          {
            echo "Prerelease ${{ steps.version.outputs.version }}"
            echo
            if [[ -n "$previous_tag" ]]; then
              echo "Changes since $previous_tag:"
              git log --pretty=format:'- %s (%h)' "$previous_tag"..HEAD
            else
              echo "Changes:"
              git log --pretty=format:'- %s (%h)' HEAD
            fi
          } > "$notes_file"
          echo "notes_file=$notes_file" >> "$GITHUB_OUTPUT"

      - name: Create or update prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          version="${{ steps.version.outputs.version }}"
          dmg_path="${{ steps.final_package.outputs.dmg_path }}"
          notes_file="${{ steps.notes.outputs.notes_file }}"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" \
              --title "$version" \
              --notes-file "$notes_file" \
              --prerelease
            gh release upload "$tag" "$dmg_path" "${dmg_path}.sha256" --clobber
          else
            gh release create "$tag" "$dmg_path" "${dmg_path}.sha256" \
              --title "$version" \
              --notes-file "$notes_file" \
              --prerelease \
              --target "$GITHUB_SHA"
          fi

      - name: Clean up signing credentials
        if: always()
        run: |
          if [[ -n "${SIGNING_KEYCHAIN_PATH:-}" && -f "${SIGNING_KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$SIGNING_KEYCHAIN_PATH" >/dev/null 2>&1 || true
          fi
